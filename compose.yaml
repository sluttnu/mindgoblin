services:
  mindgoblin:
    image: ghcr.io/sluttnu/mindgoblin:${TAG:-latest}
    container_name: mindgoblin
    restart: unless-stopped
    tmpfs: [/tmp]
    volumes:
      - mindgoblin-cache:/app/cache
      - ./cardback.jpg:/app/cardback.jpg:ro
    environment:
      PORT: "8000"
    networks: [proxy]

networks:
  proxy:
    external: true
    name: proxy

volumes:
  mindgoblin-cache:
