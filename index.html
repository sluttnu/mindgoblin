<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Stickers</title>
<style>
  @font-face {
    font-family: "Beleren";
    src: url("/Beleren2016-Bold.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --bg: #1b1b1f;
    --fg: #eee;
    --card-ratio: 488 / 680;
  }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 2rem;
  }
  h1 { text-align: center; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.25rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* The card is a div (not a button) because it contains real buttons once flipped.
     container-type lets the stickers size themselves relative to the card width (cqw). */
  .card {
    display: block;
    perspective: 1000px;
    aspect-ratio: var(--card-ratio);
    container-type: inline-size;
  }
  .card[role="button"] { cursor: pointer; }
  .card[role="button"]:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 4px; border-radius: 5%; }

  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:not(.flipped):hover .inner { transform: translateY(-4px); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4.75%;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .face.back { background: #3a2a1a; }  /* shown if cardback.jpg is missing */
  .face.front { transform: rotateY(180deg); background: #222; }

  /* Once all three cards are chosen, dim them so the stickers stand out. */
  .front img { transition: filter .4s; }
  .grid.ready .front img { filter: brightness(.7); }

  /* Name stickers: three stacked buttons, vertically centred on the card. */
  .names {
    position: absolute;
    top: 50%;
    left: 6cqw;
    right: 6cqw;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 2.5cqw;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s;
  }
  .grid.ready .names { opacity: 1; visibility: visible; }

  .name-sticker {
    font-family: "Beleren", Georgia, serif;
    font-weight: bold;
    font-size: 6cqw;
    line-height: 1.1;
    color: #1a1a1a;
    text-align: center;
    padding: 1.6cqw 3cqw;
    background: linear-gradient(#f6f3ec, #cdc8bc);
    border: 1px solid #5b564c;
    border-radius: 2.4cqw;
    box-shadow: 0 2px 5px rgba(0,0,0,.5);
    cursor: pointer;
    transition: opacity .2s, filter .2s, transform .1s;
  }
  .name-sticker:hover { filter: brightness(1.08); }
  .name-sticker:active { transform: scale(.98); }
  .name-sticker:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .name-sticker.used { opacity: .4; filter: grayscale(.6) brightness(.8); }

  .card.leaving {
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s;  /* same length as the flip */
  }

  .err { color: #ff8a8a; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .inner, .front img, .names, .name-sticker, .card.leaving { transition: none; }
  }
</style>
</head>
<body>
<h1>Name Stickers</h1>
<div class="grid" id="grid"></div>
<script src="/_widgets/mtg-menu.js" defer></script>
<script>
  const grid = document.getElementById("grid");

  // Fisher-Yates shuffle
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const MAX_REVEALS = 3;
  const selected = [];  // { el, card } in the order they were flipped

  function makeNames(card) {
    const names = document.createElement("div");
    names.className = "names";
    (card.words || []).forEach(w => names.appendChild(makeStickerButton(w)));
    return names;
  }

  // Third card chosen: fade the rest out while it flips, then (after the flip
  // has finished, so nothing shifts mid-animation) remove them and bring in the stickers.
  function finish() {
    grid.querySelectorAll(".card:not(.flipped)").forEach(c => c.classList.add("leaving"));
    setTimeout(() => {
      grid.querySelectorAll(".card.leaving").forEach(c => c.remove());
      selected.forEach(({ el, card }) => el.querySelector(".front").appendChild(makeNames(card)));
      void grid.offsetWidth;  // flush styles so the stickers fade in rather than appear
      grid.classList.add("ready");
    }, 700);
  }

  function makeStickerButton(word) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "name-sticker";
    const vowels = (word.match(/[aeiou]/gi) || []).length;
    b.textContent = `${word} (${vowels})`;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const used = b.classList.toggle("used");
      b.setAttribute("aria-pressed", String(used));
    });
    return b;
  }

  function makeCard(card) {
    const el = document.createElement("div");
    el.className = "card";
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.setAttribute("aria-label", "Face-down card");

    const inner = document.createElement("div");
    inner.className = "inner";

    // Back (cardback.jpg)
    const back = document.createElement("div");
    back.className = "face back";
    const backImg = document.createElement("img");
    backImg.src = "/cardback.jpg";
    backImg.alt = "";
    backImg.onerror = () => backImg.remove();  // fall back to the plain colour
    back.appendChild(backImg);

    // Front (card image; name stickers are added once three cards are chosen)
    const front = document.createElement("div");
    front.className = "face front";
    const frontImg = document.createElement("img");
    frontImg.src = card.image;  // preloaded now, so the flip is instant
    frontImg.alt = card.name;
    front.appendChild(frontImg);

    inner.append(back, front);
    el.appendChild(inner);

    function reveal() {
      if (el.classList.contains("flipped")) return;
      el.classList.add("flipped");
      // No longer a button once flipped.
      el.removeAttribute("role");
      el.removeAttribute("tabindex");
      el.setAttribute("aria-label", card.name);
      selected.push({ el, card });
      if (selected.length === MAX_REVEALS) finish();
    }
    el.addEventListener("click", reveal);
    el.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target === el) {
        e.preventDefault();
        reveal();
      }
    });
    return el;
  }

  async function init() {
    try {
      const res = await fetch("/api/cards");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cards = shuffle(await res.json());
      if (!cards.length) throw new Error("no cards returned");
      cards.forEach(c => grid.appendChild(makeCard(c)));
    } catch (e) {
      const p = document.createElement("p");
      p.className = "err";
      p.textContent = "Could not load cards: " + e.message;
      grid.replaceWith(p);
    }
  }
  init();
</script>
</body>
</html>
